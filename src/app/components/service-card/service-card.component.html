<div class="service-card-section d-flex aling-items-center justify-content-between">
    @for (card of cards; track card; let i = $index) {
    <div class="card position-relative overflow-hidden">
        <div class="image-card">
            <img [src]="card.src" [alt]="card.alt" [title]="card.title" [width]="card.width" [height]="card.height">
        </div>
       <div class="overlay w-100 position-absolute">
        <div class="title-card">
            <h3 class="text-center text-white fs-18px fw-600 mb-6px">{{card.title}}</h3>
        </div>
        <div class="description-card text-center fs-xs text-white fw-400">
            <p>{{card.description}}</p>
        </div>
        <div class="card-link ">
            <a href="" class="text-white text-center fs-14px fw-500 ">
                <span>
                    {{card.link}}
                </span>
                <i class="icon icon-arrow-2-left-linear"></i>
            </a>
        </div>
       </div>
    </div>
    }

</div>
