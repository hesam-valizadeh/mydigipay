<a href="">
    <div class="product-box">
        <div class="surface-back">
            <figure>
                <img [src]="src" [alt]="alt" [width]="width" [height]="height" title="{{ title }}" [loading]="loading">
            </figure>
            <div class="store-logo">
                <img [src]="storeLogoSrc" alt="arta logo" width="24" height="24" title="" loading="lazy" class="">
            </div>
            <div class="purchase-type">
                <div class="credit">
                    <i class="icon icon-credit-linear"></i>
                    <span>وام</span>
                </div>
                <div class="bnpl">
                    <i class="icon icon-bnpl-linear"></i>
                    <span>اعتبار</span>
                </div>
            </div>

        </div>
        <div class="store-info">
            <div class="store-name">
                <i class="icon icon-store-linear"></i>
                <span>{{storeName}}</span>
            </div>
            <div class="title">
                {{title}}
            </div>
            <div class="discount">
                <span>{{discountPercentage}}%</span>
                <del>{{priceNoDiscount}}</del>
            </div>
            <div class="price">
                <span>{{priceFinal}}</span>
                <span>تومان</span>
            </div>
        </div>
    </div>
</a>
