<div [ngClass]="className" [ngStyle]="{'cssText': styleAttr}">
  <div class="content">
    <h1 class="text-white fw-900 fs-18px">خدمات بیمه‌، اقساطی</h1>
    <p class="text-white fs-xs fw-300 text-center mx-auto">
      از کارت به کارت، خرید شارژ و اینترنت، تا پرداخت قبض رو سریع و آسان انجام بده.
    </p>
    <figure>
      <img #figureImg class="slide-image" loading="lazy" ngOptimizedImage width="100" height="100" [ngSrc]="src"
        [alt]="alt || title" />
    </figure>
  </div>
</div>
