name: Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"] # زمانی اجرا شو که فایل قبلی تمام شد
    types: [completed]
    branches: [dev]

permissions:
  packages: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mydigipay:latest
