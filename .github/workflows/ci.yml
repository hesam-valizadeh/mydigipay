name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build Angular & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # اگر تست‌های Karma یا Cypress دارید، اینجا اضافه کنید
      # - name: Run Tests
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular
        run: npm run build -- --configuration=production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod # مطمئن شوید نام فایل و مسیر درست است
          push: false # فعلاً فقط برای تست بیلد، پوش نمی‌کنیم
          tags: mydigipay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
