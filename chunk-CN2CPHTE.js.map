<div class="heading d-flex justify-content-between align-items-center p-0 w-100">
	<div class="d-flex align-items-center gap-3 justify-content-between w-100">
		<h3 class="fs-14px fw-800">{{ title }}</h3>

		@if (timerEndDate) {
		<app-countdown-timer [endDate]="timerEndDate"></app-countdown-timer>
		}
	</div>

	@if (viewAllLink) {
	<a
		class="text-primary product-section-link d-flex align-items-center gap-1"
		[routerLink]="viewAllLink"
	>
		<span>همه</span>
		<i class="icon icon-arrow-2-left-linear text-primary"></i>
	</a>
	}
</div>
