<app-custom-swiper
	#swiperRef
	pagination="true"
	[config]="SwiperConfig"
	[startIndex]="1"
	[slides]="slider?.data ?? []"
>
	<ng-template #swiperSlideTemplate let-index="index">
		<app-carousel-banner-item
			[src]="slider?.item(index)?.src"
			[title]="slider?.item(index)?.title"
			[alt]="slider?.item(index)?.alt"
			[width]="slider?.item(index)?.width"
			[height]="slider?.item(index)?.height"
			[link]="slider?.item(index)?.link"
		></app-carousel-banner-item>
	</ng-template>
</app-custom-swiper>
