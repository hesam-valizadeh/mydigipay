        height: 100%;

        padding: 5px;
        font-size: 0.875rem;

      }

        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: row;

        align-items: center;

        display: flex;
        flex-direction: row;
        align-items: center;
      }

        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        margin-right: 1rem;
      }
      .size-selector input {
        margin: 0 0.3rem 0 0;
      }
      .filters {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .module-filters {
        display: flex;
        flex-grow: 1;
      }
      .module-filter {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;

      }
      .module-filter input {
        flex: 1;

        padding: 0.01rem;
        font-size: 0.7rem;
        margin-left: 0.3rem;
      }
      .module-filter + .module-filter {

      .node {
